spring.application.name=vendoria-backend
server.port=8080

# Database (override lewat env var; jangan commit password)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/db_vendoria}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}

# Skema dikelola manual, Hibernate hanya memvalidasi -- jangan ganti ke create/update/create-drop
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Origin frontend (Vite dev server); pisahkan dengan koma
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# Sesi login: cookie HttpOnly (tak terbaca JavaScript), SameSite=Lax (tak ikut request lintas-situs)
server.servlet.session.cookie.name=VENDORIA_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# WAJIB true di produksi (HTTPS); false hanya agar jalan di http://localhost
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
# Sesi 30 hari: timeout = batas diam di server, max-age = umur cookie di browser (tanpa ini cookie hilang saat browser ditutup).
# Cookie diberi umur sekali saat login, jadi login paling lama 30 hari sejak masuk.
server.servlet.session.timeout=30d
server.servlet.session.cookie.max-age=30d
server.servlet.session.tracking-modes=cookie

# Resend (email OTP). Key dibaca dari variabel `Resend` di file .env di root project (git-ignored) atau env var.
# Backend dijalankan dari folder backend/, maka .env ada di ../.env
spring.config.import=optional:file:../.env[.properties]
resend.api-key=${Resend:}
# Tanpa domain terverifikasi, onboarding@resend.dev hanya bisa kirim ke email pemilik akun Resend
resend.from=${RESEND_FROM:Vendoria <onboarding@resend.dev>}

# Login Google (OAuth 2.0 / OpenID Connect). ID & secret dari .env atau env var -- JANGAN ditulis di sini.
# Default "belum-diisi" supaya backend tetap bisa start tanpa kredensial Google (tombol Google akan ditolak Google).
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:belum-diisi}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:belum-diisi}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
# Harus persis sama dengan yang didaftarkan di Google Cloud. Dibuat eksplisit karena request dari frontend lewat
# proxy Vite (host :5173), sehingga Spring akan menyusun redirect URI yang salah bila dibiarkan otomatis.
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}
# Tujuan redirect setelah login Google berhasil / gagal
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

management.endpoints.web.exposure.include=health
